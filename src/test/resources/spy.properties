# ABOUTME: p6spy config for -Dsql.spy runs: every JDBC statement to stdout,
# ABOUTME: parameters interpolated into the effective SQL, one line each.
appender=com.p6spy.engine.spy.appender.StdoutLogger
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(category) %(effectiveSql)
excludecategories=info,debug,result,resultset
